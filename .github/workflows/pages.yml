# Build XPPAUT-Web (C -> WebAssembly with Emscripten, then the Vite page)
# and publish it to GitHub Pages on every push to master.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EMSDK_VERSION: 6.0.13

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten
        run: scripts/setup-emsdk.sh

      - name: Install page dependencies
        run: npm ci

      - name: Build XPP (WebAssembly), examples and help
        run: scripts/build-web.sh

      - name: Build the page
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
